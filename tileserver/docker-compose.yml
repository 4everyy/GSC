# tileserver-gl 离线瓦片服务 Docker Compose 配置
  #
  # 职责：
  # - 一键启动本地瓦片服务（暗色矢量底图 + 中文字体）；
  # - 数据卷挂载，mbtiles / style.json / 字体包与容器解耦，便于更新。
  #
  # 使用方式：
  #   cd tileserver
  #   docker compose up -d
  #   # 访问 http://localhost:8081 验证瓦片服务
  #
  # 停止：docker compose down
  # 查看日志：docker compose logs -f tileserver
  services:
    tileserver:
      # 使用官方 maptiler/tileserver-gl 镜像（内置 tileserver-gl + mbtiles 支持）
      image: maptiler/tileserver-gl:v5.2.0
      container_name: gcs-tileserver
      restart: unless-stopped
      ports:
        # 宿主机 8081 → 容器 8080（避免与现有 uav-task-server 的 8080 冲突）
        - "8081:8080"
      volumes:
        # 主配置文件：定义瓦片源、样式、字体路径
        - ./config.json:/data/config.json:ro
        # 矢量瓦片数据（mbtiles 格式，需提前准备）
        - ./data:/data/data:ro
        # 暗色样式 JSON + 图标 sprites
        - ./styles:/data/styles:ro
        # 中文字体切片（Noto Sans CJK 等 pbf 格式）
        - ./fonts:/data/fonts:ro
      command: --config /data/config.json --public_url http://localhost:8081
      healthcheck:
        # tileserver-gl 容器内无 curl/wget，使用 node 内置 http 模块探测 /health
        test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 15s
