# ============================================================
# GSC 地面站前端 — Ubuntu Nginx 站点配置
# ============================================================
# 用途：托管 Vite 构建产物（dist/），纯静态站点，无后端 API 反代。
# 部署路径约定：/var/www/gsc （目录内容 = dist/ 解包后的内容）
#
# 安装：
#   sudo cp deploy/nginx/gsc.conf /etc/nginx/sites-available/gsc
#   sudo ln -s /etc/nginx/sites-available/gsc /etc/nginx/sites-enabled/gsc
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name _;  # 部署时替换为实际域名或服务器 IP

    root /var/www/gsc;
    index index.html;

    # ---------- 基础安全/编码头 ----------
    charset utf-8;
    server_tokens off;

    # ---------- SPA 路由回退 ----------
    # 前端为单页应用，刷新/直访非根路径时统一回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 指纹化构建产物：强缓存 ----------
    # Vite 输出的 /assets/* 文件名均带 hash，内容变则名变，可安全长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---------- 指纹化字体切片（pbf glyphs）：强缓存 ----------
    # public/fonts 同样内容寻址，长缓存
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---------- MBTiles 城市离线包：大文件下载优化 ----------
    # 前端切换城市时 fetch /maps/{key}.mbtiles 导入 IndexedDB，体积大（数十~数百 MB）
    # - sendfile + tcp_nopush 提升大文件吞吐
    # - 长缓存（文件内容不变；城市包更新频率极低）
    # - woff2/pbf/.mbtiles 等类型已由 mime.types 覆盖或默认 application/octet-stream
    location /maps/ {
        sendfile on;
        tcp_nopush on;
        sendfile_max_chunk 512k;
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    # ---------- 视频资源 ----------
    location /videos/ {
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    # ---------- index.html：禁止缓存 ----------
    # 保证发版后用户立即拿到新入口文件
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- gzip ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    # 注意：.pbf 字体切片与 .mbtiles 已是二进制压缩格式，不再 gzip

    # ---------- wasm / pbf MIME ----------
    # sql.js wasm、maplibre 字体切片需正确 MIME，避免浏览器告警或拒绝执行
    location ~* \.(wasm|pbf)$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---------- 日志 ----------
    access_log /var/log/nginx/gsc.access.log;
    error_log  /var/log/nginx/gsc.error.log warn;
}