# GSC (Ground Control Station) — nginx 站点配置
# 用法（Docker）：
#   docker run -d --name gsc-nginx -p 80:80 -p 443:443 \
#     -v d:\noEditVersion\GSC\dist:/usr/share/nginx/html:ro \
#     -v d:\noEditVersion\GSC\deploy\nginx.conf:/etc/nginx/conf.d/default.conf:ro \
#     -v d:\noEditVersion\GSC\deploy\certs:/etc/nginx/certs:ro \
#     skydash-frontend:latest

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 自签名证书（SAN: localhost / gsc.local / 本机 IP，由 deploy/start-https.ps1 生成）
    ssl_certificate     /etc/nginx/certs/gsc.crt;
    ssl_certificate_key /etc/nginx/certs/gsc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    # 注入定制（无需改动 src/）：隐藏「手动导入 .mbtiles」入口 + 全局导入进度浮层。
    # 资源放 dist/inject/（源文件在 deploy/inject/，构建后同步）。
    # <script> 置于 <head>：在应用 bundle 之前装好 IDBObjectStore.put 拦截。
    sub_filter '</title>' '</title><link rel="stylesheet" href="/inject/hide-offline-import.css"><script src="/inject/import-progress.js"></script>';
    sub_filter_once on;

    # gzip 压缩（瓦片 pbf / js / css 等）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/vnd.mapbox-vector-tile;
    gzip_vary on;

    # 带内容哈希的静态资源：长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：任意路径未命中文件时返回 index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # sql.js 的 WASM 文件需正确 Content-Type，mime.types 缺失时兜底
    # （不要在此用 types{} 覆盖全局 mime，否则 ttf/mp4 等类型会丢失）
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ===== 反向代理：Vite dev server（源码实时预览） =====
# 访问 http://<host>:8081 即代理到宿主机 5173 的 Vite 开发服务器，
# 改动 src/ 即时生效（HMR）。host.docker.internal 由 Docker Desktop 提供
# （保险起见容器启动加 --add-host=host.docker.internal:host-gateway）。
# dev 模式源码直出，不做 sub_filter 注入。
server {
    listen 8081;
    server_name _;

    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        # WebSocket 升级（Vite HMR）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HMR 长连接不断开
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
